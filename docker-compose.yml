version: "3.8"

# Avvia Neo4j e Cassandra con risorse comparabili, per un confronto equo
# "a parità di condizioni hardware/software" come richiesto dalla traccia.
# Regola i limiti di memoria in base al tuo hardware (i7-12700H, 20 thread: puoi
# permetterti di dare 2-4 GB a ciascun DB senza soffrire).

services:
  neo4j:
    image: neo4j:5.24
    container_name: flights_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (usato dal driver Python)
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_initial__size=2G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      # FIX: Neo4j 5.x limita la memoria usabile dalle transazioni con un
      # pool separato (db.memory.transaction.total.max), che di default
      # NON scala automaticamente con l'heap max configurato sopra e puo'
      # restare molto piu' basso di 2G. E' questo pool, non l'heap, ad
      # aver dato il MemoryPoolOutOfMemoryError durante la DETACH DELETE
      # a lotti. 0 = nessun limite specifico (resta comunque vincolato
      # all'heap reale).
      - NEO4J_db_memory_transaction_total_max=0
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  cassandra:
    image: cassandra:4.1
    container_name: flights_cassandra
    ports:
      - "9042:9042"   # CQL native protocol
    environment:
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=400M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  neo4j_data:
  cassandra_data:
